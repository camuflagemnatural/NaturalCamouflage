<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel · Natural Camouflage</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nc-core/css/core.css">
<style>
main{max-width:1320px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.lay{display:grid;grid-template-columns:180px minmax(0,1fr);gap:26px;align-items:start}
.lay nav{display:grid;gap:4px;position:sticky;top:16px}
.lay nav a{padding:10px 12px;border-radius:10px;color:var(--mut);font-weight:700;font-size:14px}
.lay nav a[aria-current]{background:var(--bone);color:var(--ink)}
.pn{padding:18px;display:grid;gap:12px}.pn h2{font-size:15px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kp .card{display:block;padding:14px}.kp b{display:block;font:800 21px Unbounded;margin:4px 0}.kp small{color:var(--mut)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);text-align:left;font-weight:500;padding:8px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.go{cursor:pointer}tr.go:hover td{background:rgba(255,255,255,.04)}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--mut);white-space:nowrap}
.bd.g{color:var(--ok);border-color:var(--ok)}.bd.r{color:var(--err);border-color:var(--err)}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px}.bars i{flex:1;background:var(--teal);min-height:2px;border-radius:2px 2px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>input,.row>select{width:auto}
input[type=checkbox]{width:auto}.chk{display:flex;gap:8px;align-items:center;color:var(--bone);font-size:14px;margin:0}
.num{width:72px;padding:8px;text-align:center}.low{border-color:var(--err)}
.btn.s{padding:8px 14px;font-size:13px}
.thumb{width:34px;height:58px;object-fit:contain;background:#f7f7f9;border-radius:6px}
.ok{color:var(--ok)}.mut{color:var(--mut)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.lay,.two{grid-template-columns:1fr}.lay nav{display:flex;overflow-x:auto;position:static}.lay nav a{white-space:nowrap}}
</style></head><body>
<main><div id="app"></div></main>
<script>
/* ===== base ===== */
const API='https://natural-camouflage-backend.onrender.com',K='ncadmin.auth';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt=d=>d?new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';
const cents=v=>Math.round(parseFloat(String(v).replace(',','.'))*100);
const qs=o=>{const p=new URLSearchParams();for(const[k,v]of Object.entries(o))if(v!==''&&v!=null)p.set(k,v);const s=p.toString();return s?'?'+s:''};
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch{}
const keep=d=>{S=d;try{d?localStorage.setItem(K,JSON.stringify(d)):localStorage.removeItem(K)}catch{}};
const tok=d=>({accessToken:d.accessToken,refreshToken:d.refreshToken,exp:Date.now()+d.expiresIn*1000-30000,user:d.user});
const toast=m=>{let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.append(t)}t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2800)};
const run=async(b,fn)=>{b.disabled=true;try{await fn()}catch(e){toast(e.message)}finally{b.disabled=false}};
const isAdmin=()=>S?.user?.role==='admin';
const post=(path,body)=>fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
let rp=null;
const refresh=()=>rp||(rp=post('/api/auth/refresh',{refreshToken:S?.refreshToken}).then(async r=>{if(r.ok){const d=await r.json();keep(tok({...d,user:d.user||S.user}));return true}keep(null);return false}).catch(()=>false).finally(()=>{rp=null}));
async function api(path,{method='GET',body,auth=true}={}){
 const go=()=>fetch(API+path,{method,headers:{'Content-Type':'application/json',...(auth&&S?{Authorization:'Bearer '+S.accessToken}:{})},body:body?JSON.stringify(body):undefined});
 if(auth&&S&&S.exp<Date.now())await refresh();
 let r=await go();if(r.status===401&&auth&&S&&await refresh())r=await go();
 let d=null;try{d=await r.json()}catch{}
 if(!r.ok){if(r.status===401&&auth){keep(null);setTimeout(route)}const e=new Error(d?.error||'Algo deu errado.');e.status=r.status;throw e}
 return d}

const ST={awaiting_payment:'Aguardando pagamento',paid:'Pago',preparing:'Em separação',shipped:'Enviado',delivered:'Entregue',cancelled:'Cancelado',expired:'Expirado',refunded:'Reembolsado'};
const bd=s=>`<span class="bd ${['paid','preparing','shipped','delivered'].includes(s)?'g':['cancelled','expired','refunded'].includes(s)?'r':''}">${esc(ST[s]||s)}</span>`;
const V=()=>$('#v');

/* ===== login / shell / rota ===== */
function login(){
 $('#app').innerHTML=`<div class="card pn" style="max-width:400px;margin:8vh auto 0"><h1 class="ttl" style="font-size:22px">Painel NC</h1><p class="sub" style="margin:0">Acesso restrito à equipe.</p><form id="fl" style="display:grid;gap:12px"><div><label for="e">E-mail</label><input id="e" type="email" autocomplete="username" required></div><div><label for="p">Senha</label><input id="p" type="password" autocomplete="current-password" required></div><div id="er" class="err" role="alert"></div><button class="btn full">Entrar</button></form></div>`;
 $('#fl').onsubmit=async e=>{e.preventDefault();const b=$('#fl .btn'),er=$('#er');b.disabled=true;er.textContent='';
  const slow=setTimeout(()=>er.textContent='Acordando o servidor, pode levar até 1 minuto…',4000);
  try{const d=await api('/api/auth/login',{method:'POST',body:{email:$('#e').value,password:$('#p').value},auth:false});
   if(!['admin','staff'].includes(d.user.role)){post('/api/auth/logout',{refreshToken:d.refreshToken}).catch(()=>{});er.textContent='Esta conta não tem acesso ao painel.';return}
   keep(tok(d));route()}catch(x){er.textContent=x.message}finally{clearTimeout(slow);b.disabled=false}}}

const NAV=[['dashboard','Resumo'],['pedidos','Pedidos'],['produtos','Produtos'],['estoque','Estoque'],['cupons','Cupons']];
function shell(cur){
 $('#app').innerHTML=`<div class="top"><h1 class="ttl" style="font-size:20px;margin:0">NC · Painel</h1><div class="row"><span class="mut" style="font-size:13px">${esc(S.user.name)} · ${isAdmin()?'admin':'equipe'}</span><button class="btn sec s" id="out">Sair</button></div></div>
 <div class="lay"><nav aria-label="Painel">${NAV.map(([k,l])=>`<a href="#/${k}"${k===cur?' aria-current="page"':''}>${l}</a>`).join('')}</nav><section id="v"><div class="empty">Carregando…</div></section></div>`;
 $('#out').onclick=()=>{const t=S.refreshToken;keep(null);post('/api/auth/logout',{refreshToken:t}).catch(()=>{});route()}}
async function route(){
 if(!S)return login();
 const [k,arg]=location.hash.replace(/^#\/?/,'').split('/'),cur=VIEW[k]?k:'dashboard';
 shell(cur);
 try{await VIEW[cur](decodeURIComponent(arg||''))}catch(e){V().innerHTML=`<div class="err">${esc(e.message)}</div>`}}

/* ===== resumo ===== */
async function dashboard(){
 const d=await api('/api/admin/dashboard?days=30'),mx=Math.max(1,...d.salesByDay.map(s=>s.revenueCents));
 V().innerHTML=`<div class="kp">
 <div class="card"><small>Vendas hoje</small><b>${brl(d.today.revenueCents)}</b><small>${d.today.orders} pedido(s)</small></div>
 <div class="card"><small>Últimos 7 dias</small><b>${brl(d.last7days.revenueCents)}</b><small>${d.last7days.orders} pedido(s)</small></div>
 <div class="card"><small>Últimos ${d.period.days} dias</small><b>${brl(d.period.revenueCents)}</b><small>ticket médio ${brl(d.period.avgTicketCents)}</small></div>
 <a class="card" href="#/pedidos"><small>A enviar</small><b>${d.toShip}</b><small>${d.awaitingPayment} aguardando pagamento</small></a></div>
 <div class="card pn" style="margin-top:12px"><h2>Vendas por dia (${d.period.days} dias)</h2><div class="bars">${d.salesByDay.map(s=>`<i title="${esc(s.day)}: ${brl(s.revenueCents)}" style="height:${Math.round(s.revenueCents/mx*100)}%"></i>`).join('')}</div></div>
 <div class="two" style="margin-top:12px">
 <div class="card pn"><h2>Mais vendidos</h2>${d.topProducts.length?d.topProducts.map(t=>`<div class="row" style="justify-content:space-between"><span>${esc(t.name)}</span><span class="mut">${t.qty} un · ${brl(t.revenueCents)}</span></div>`).join(''):'<span class="mut">Sem vendas no período.</span>'}</div>
 <div class="card pn"><h2>Estoque baixo</h2>${d.lowStock.length?d.lowStock.map(l=>`<div class="row" style="justify-content:space-between"><span>${esc(l.name)} · ${esc(l.size)}</span><span class="bd ${l.qty?'':'r'}">${l.qty} un</span></div>`).join(''):'<span class="ok">Tudo em dia.</span>'}<a class="mut" href="#/estoque">Abrir estoque →</a></div></div>`}

/* ===== pedidos ===== */
let F={status:'',q:'',page:1};
async function pedidos(ref){
 if(ref)return pedido(ref);
 const d=await api('/api/admin/orders'+qs({status:F.status,q:F.q,page:F.page})),pages=Math.max(1,Math.ceil(d.total/d.pageSize));
 V().innerHTML=`<form id="ff" class="row" style="margin-bottom:12px"><select id="fs" style="max-width:210px"><option value="">Todos os status</option>${Object.entries(ST).map(([k,l])=>`<option value="${k}"${k===F.status?' selected':''}>${l}</option>`).join('')}</select><input id="fq" type="search" placeholder="Código, nome, e-mail ou rastreio" value="${esc(F.q)}" style="flex:1;min-width:200px"><button class="btn s">Filtrar</button></form>
 <div class="card tw">${d.orders.length?`<table><thead><tr><th>Pedido</th><th>Data</th><th>Cliente</th><th>Pgto</th><th>Total</th><th>Status</th></tr></thead><tbody>${d.orders.map(o=>`<tr class="go" data-c="${esc(o.code)}"><td>${esc(o.code.slice(0,11))}…</td><td>${dt(o.createdAt)}</td><td>${esc(o.customer.name)}</td><td>${esc(o.method||'')}</td><td>${brl(o.totalCents)}</td><td>${bd(o.status)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum pedido.</div>'}</div>
 <div class="row" style="margin-top:12px;justify-content:space-between"><span class="mut" style="font-size:13px">${d.total} pedido(s) · página ${d.page} de ${pages}</span><span class="row"><button class="btn sec s" id="pv"${d.page<=1?' disabled':''}>‹</button><button class="btn sec s" id="nx"${d.page>=pages?' disabled':''}>›</button></span></div>`;
 $('#ff').onsubmit=e=>{e.preventDefault();F={status:$('#fs').value,q:$('#fq').value.trim(),page:1};route()};
 $$('tr.go').forEach(r=>r.onclick=()=>location.hash='#/pedidos/'+r.dataset.c);
 $('#pv').onclick=()=>{F.page--;route()};$('#nx').onclick=()=>{F.page++;route()}}

async function pedido(ref){
 const d=await api('/api/admin/orders/'+encodeURIComponent(ref)),o=d.order,a=o.address||{},T=d.allowedTransitions,code=encodeURIComponent(o.code);
 const L={preparing:'Marcar em separação',delivered:'Marcar entregue',cancelled:'Cancelar pedido'};
 V().innerHTML=`<a class="mut" href="#/pedidos">‹ Pedidos</a>
 <div class="row" style="justify-content:space-between;margin:8px 0 14px"><h2 style="font-size:15px;word-break:break-all">${esc(o.code)}</h2>${bd(o.status)}</div>
 <div class="two"><div class="card pn"><h2>Cliente</h2><div>${esc(o.customer.name)}<br><span class="mut">${esc(o.customer.email)}<br>${esc(o.customer.phone||'')} · CPF ${esc(o.customer.cpf||'')}</span></div></div>
 <div class="card pn"><h2>Entrega</h2><div>${esc(a.rua)}, ${esc(a.numero)} ${esc(a.complemento||'')}<br><span class="mut">${esc(a.bairro)} · ${esc(a.cidade)}/${esc(a.uf)} · CEP ${esc(a.cep)}</span>${o.trackingCode?`<br>${esc(o.carrier||'Rastreio')}: <b>${esc(o.trackingCode)}</b>`:''}</div></div></div>
 <div class="card tw" style="margin-top:12px"><table><thead><tr><th>Item</th><th>Tam.</th><th>Qtd</th><th>Unit.</th></tr></thead><tbody>${d.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.size)}</td><td>${i.qty}</td><td>${brl(i.unitCents)}</td></tr>`).join('')}</tbody></table>
 <div class="pn mut" style="text-align:right">Subtotal ${brl(o.subtotalCents)} · Frete ${brl(o.shippingCents)}${o.discountCents?` · Cupom ${esc(o.couponCode||'')} −${brl(o.discountCents)}`:''}${o.pixDiscountCents?` · Pix −${brl(o.pixDiscountCents)}`:''}<br><b style="color:var(--bone);font-size:16px">Total ${brl(o.totalCents)}</b></div></div>
 ${T.length?`<div class="card pn" style="margin-top:12px"><h2>Ações</h2>${T.includes('shipped')?`<form id="fsh" class="row"><input id="ca" placeholder="Transportadora" maxlength="60" style="max-width:180px"><input id="tc" placeholder="Código de rastreio" maxlength="60" style="max-width:230px"><button class="btn s">Marcar como enviado</button></form>`:''}<div class="row">${T.filter(t=>t!=='shipped').map(t=>`<button class="btn ${t==='cancelled'?'sec ':''}s" data-t="${t}">${L[t]}</button>`).join('')}</div></div>`:''}
 <div class="card pn" style="margin-top:12px"><h2>Pagamentos</h2>${d.payments.map(p=>`<div class="row" style="justify-content:space-between"><span>${esc(p.method)} · ${brl(p.amountCents)} · ${esc(p.status)}${p.refundedCents?` · reembolsado ${brl(p.refundedCents)}`:''}</span>${isAdmin()&&p.status==='approved'&&p.refundedCents<p.amountCents?`<button class="btn sec s" data-rf="${esc(p.id)}">Reembolsar</button>`:''}</div>`).join('')||'<span class="mut">Sem pagamentos.</span>'}
 ${isAdmin()&&d.payments.some(p=>p.status==='approved')?`<label class="chk"><input type="checkbox" id="rs"> Devolver os itens ao estoque no reembolso</label>`:''}</div>
 <div class="card pn" style="margin-top:12px"><h2>Observações internas</h2><textarea id="nt" rows="3" maxlength="2000">${esc(o.notes||'')}</textarea><div><button class="btn sec s" id="sn">Salvar observações</button></div></div>
 <div class="card pn" style="margin-top:12px"><h2>Histórico</h2>${d.events.map(e=>`<div><b>${esc(e.label)}</b> <span class="mut">· ${dt(e.at)}${e.actor?' · '+esc(e.actor):''}${e.note?' · '+esc(e.note):''}</span></div>`).join('')}</div>`;
 const st=(status,extra)=>api(`/api/admin/orders/${code}/status`,{method:'PATCH',body:{status,...extra}}).then(()=>{toast('Status atualizado');route()});
 if($('#fsh'))$('#fsh').onsubmit=e=>{e.preventDefault();run($('#fsh .btn'),()=>st('shipped',{carrier:$('#ca').value.trim()||undefined,trackingCode:$('#tc').value.trim()||undefined}))};
 $$('[data-t]').forEach(b=>b.onclick=()=>{if(b.dataset.t==='cancelled'&&!confirm('Cancelar este pedido? O estoque reservado volta.'))return;run(b,()=>st(b.dataset.t))});
 $$('[data-rf]').forEach(b=>b.onclick=()=>{if(!confirm('Reembolsar o pagamento no Mercado Pago? Não dá para desfazer.'))return;
  run(b,async()=>{await api(`/api/admin/payments/${b.dataset.rf}/refund`,{method:'POST',body:{restock:!!$('#rs')?.checked}});toast('Reembolso solicitado');route()})});
 $('#sn').onclick=()=>run($('#sn'),async()=>{await api(`/api/admin/orders/${code}`,{method:'PATCH',body:{notes:$('#nt').value}});toast('Observações salvas')})}

/* ===== produtos ===== */
async function produtos(arg){
 const [{products},{categories}]=await Promise.all([api('/api/admin/products'),api('/api/admin/categories')]);
 if(arg){const p=arg==='novo'?null:products.find(x=>String(x.id)===arg);if(arg==='novo'||p)return pform(p,categories)}
 V().innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="mut">${products.length} produto(s)</span><a class="btn s" href="#/produtos/novo">+ Novo produto</a></div>
 <div class="card tw"><table><thead><tr><th></th><th>Produto</th><th>Preço</th><th>Estoque</th><th>Status</th><th></th></tr></thead><tbody>${products.map(p=>`<tr class="go" data-id="${p.id}"><td>${p.images[0]?`<img class="thumb" src="${esc(p.images[0])}" alt="">`:''}</td><td>${esc(p.name)}<br><small class="mut">${esc(p.categoryName||'Sem categoria')}</small></td><td>${brl(p.priceCents)}</td><td>${Object.values(p.stock||{}).reduce((a,b)=>a+b,0)} un</td><td><span class="bd ${p.active?'g':'r'}">${p.active?'Ativo':'Oculto'}</span>${p.featured?' <span class="bd">Destaque</span>':''}</td><td class="mut">Editar ›</td></tr>`).join('')}</tbody></table></div>`;
 $$('tr.go').forEach(r=>r.onclick=()=>location.hash='#/produtos/'+r.dataset.id)}
function pform(p,cats){
 const v=(x,d='')=>esc(p?x:d);
 V().innerHTML=`<a class="mut" href="#/produtos">‹ Produtos</a><form id="fp" class="card pn" style="margin-top:10px"><h2>${p?'Editar produto':'Novo produto'}</h2>
 <div class="f"><div class="w"><label for="n">Nome</label><input id="n" value="${v(p?.name)}" minlength="2" maxlength="120" required></div>
 <div><label for="co">Cor</label><input id="co" value="${v(p?.color)}" maxlength="40"></div>
 <div><label for="ct">Categoria</label><select id="ct"><option value="">Sem categoria</option>${cats.map(c=>`<option value="${c.id}"${p?.categoryId===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
 <div><label for="pr">Preço (R$)</label><input id="pr" inputmode="decimal" value="${p?(p.priceCents/100).toFixed(2):''}" required></div>
 <div><label for="ca">Preço "de" (R$, opcional)</label><input id="ca" inputmode="decimal" value="${p?.compareAtCents?(p.compareAtCents/100).toFixed(2):''}"></div>
 <div class="w"><label for="ds">Descrição</label><textarea id="ds" rows="3" maxlength="5000">${v(p?.description)}</textarea></div>
 <div class="w"><label for="im">Imagens (um caminho por linha, ex.: /nc-core/assets/products/image-001.jpg)</label><textarea id="im" rows="4">${esc((p?.images||[]).join('\n'))}</textarea></div>
 <label class="chk"><input type="checkbox" id="ac"${!p||p.active?' checked':''}> Visível na loja</label><label class="chk"><input type="checkbox" id="ft"${p?.featured?' checked':''}> Destaque</label></div>
 ${p?'':'<p class="mut" style="margin:0;font-size:13px">O estoque começa em 0. Ajuste em Estoque depois de salvar.</p>'}
 <div><button class="btn">Salvar</button></div></form>`;
 $('#fp').onsubmit=e=>{e.preventDefault();run($('#fp .btn'),async()=>{
  const pr=cents($('#pr').value),ca=$('#ca').value.trim();if(!(pr>0))throw new Error('Informe um preço válido');
  const b={name:$('#n').value.trim(),color:$('#co').value.trim()||null,priceCents:pr,compareAtCents:ca?cents(ca):null,categoryId:$('#ct').value?+$('#ct').value:null,description:$('#ds').value.trim(),images:$('#im').value.split('\n').map(s=>s.trim()).filter(Boolean),active:$('#ac').checked,featured:$('#ft').checked};
  await api(p?'/api/admin/products/'+p.id:'/api/admin/products',{method:p?'PUT':'POST',body:b});toast('Produto salvo');location.hash='#/produtos'})}}

/* ===== estoque ===== */
async function estoque(){
 const d=await api('/api/admin/stock'),by={};
 d.stock.forEach(s=>(by[s.productId]??=({name:s.name,active:s.active,sz:{}})).sz[s.size]=s);
 const SZ=['P','M','G','GG'];
 V().innerHTML=`<p class="mut" style="margin-top:0">Digite a quantidade real e saia do campo para salvar. Alerta vermelho = ${d.lowStockThreshold} unidade(s) ou menos.</p>
 <div class="card tw"><table><thead><tr><th>Produto</th>${SZ.map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${Object.entries(by).map(([id,p])=>`<tr><td${p.active?'':' class="mut"'}>${esc(p.name)}${p.active?'':' (oculto)'}</td>${SZ.map(s=>{const x=p.sz[s];return x?`<td><input class="num${x.low?' low':''}" type="number" min="0" max="100000" value="${x.qty}" data-p="${id}" data-s="${s}" data-v="${x.qty}" aria-label="${esc(p.name)} ${s}"></td>`:'<td>—</td>'}).join('')}</tr>`).join('')}</tbody></table></div>`;
 $$('.num').forEach(i=>i.onchange=async()=>{const qty=parseInt(i.value,10);
  if(!(qty>=0)){i.value=i.dataset.v;return}
  i.disabled=true;
  try{await api('/api/admin/stock/'+i.dataset.p,{method:'PUT',body:{size:i.dataset.s,qty}});i.dataset.v=qty;i.classList.toggle('low',qty<=d.lowStockThreshold);toast('Estoque salvo')}
  catch(e){i.value=i.dataset.v;toast(e.message)}finally{i.disabled=false}})}

/* ===== cupons ===== */
async function cupons(){
 const {coupons}=await api('/api/admin/coupons');
 const val=c=>c.type==='percent'?c.value+'%':c.type==='fixed'?brl(c.value):'Frete grátis';
 V().innerHTML=`${isAdmin()?`<form id="fc" class="card pn" style="margin-bottom:12px"><h2>Novo cupom</h2><div class="row"><input id="cc" placeholder="CÓDIGO" maxlength="40" style="max-width:160px;text-transform:uppercase" required><select id="ct" style="max-width:170px"><option value="percent">Percentual (%)</option><option value="fixed">Valor fixo (R$)</option><option value="free_shipping">Frete grátis</option></select><input id="cv" placeholder="Valor" inputmode="decimal" style="max-width:100px"><input id="cm" placeholder="Mínimo R$" inputmode="decimal" style="max-width:110px"><input id="cu" type="number" min="1" placeholder="Usos máx." style="max-width:110px"><input id="ce" type="datetime-local" aria-label="Expira em" style="max-width:210px"><button class="btn s">Criar</button></div></form>`:''}
 <div class="card tw">${coupons.length?`<table><thead><tr><th>Código</th><th>Desconto</th><th>Mínimo</th><th>Usos</th><th>Expira</th><th>Status</th><th></th></tr></thead><tbody>${coupons.map(c=>`<tr><td><b>${esc(c.code)}</b></td><td>${val(c)}</td><td>${c.minSubtotalCents?brl(c.minSubtotalCents):'—'}</td><td>${c.usedCount}${c.maxUses?' / '+c.maxUses:''}</td><td>${c.expiresAt?dt(c.expiresAt):'—'}</td><td><span class="bd ${c.active?'g':'r'}">${c.active?'Ativo':'Inativo'}</span></td><td>${isAdmin()?`<button class="btn sec s" data-id="${c.id}" data-on="${c.active?0:1}">${c.active?'Desativar':'Ativar'}</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum cupom.</div>'}</div>`;
 if($('#fc'))$('#fc').onsubmit=e=>{e.preventDefault();run($('#fc .btn'),async()=>{
  const type=$('#ct').value,raw=$('#cv').value.trim(),value=type==='percent'?parseInt(raw,10):type==='fixed'?cents(raw):0;
  if(type!=='free_shipping'&&!(value>0))throw new Error('Informe o valor do desconto');
  const b={code:$('#cc').value.trim(),type,value,minSubtotalCents:$('#cm').value.trim()?cents($('#cm').value):0,maxUses:$('#cu').value?+$('#cu').value:null,expiresAt:$('#ce').value?new Date($('#ce').value).toISOString():null};
  await api('/api/admin/coupons',{method:'POST',body:b});toast('Cupom criado');route()})};
 $$('[data-id]').forEach(b=>b.onclick=()=>run(b,async()=>{await api('/api/admin/coupons/'+b.dataset.id,{method:'PUT',body:{active:b.dataset.on==='1'}});toast('Cupom atualizado');route()}))}

const VIEW={dashboard,pedidos,produtos,estoque,cupons};
addEventListener('hashchange',route);route();
</script>
</body></html>
